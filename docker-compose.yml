services:
  dev:
    build:
      context: .
      target: dev
    image: comic-cleaner-dev:local
    working_dir: /workspace
    # Run as the host user, so caches, build output and crash logs written into
    # the bind mount stay owned by you rather than root.
    user: "${CC_UID:-1000}:${CC_GID:-1000}"
    volumes:
      - .:/workspace
      - ${CC_TEST_COMICS:-/home/prime/Temp/PageMaster-Test-Content}:/comics:ro
    environment:
      # No home directory exists for an arbitrary UID; pip, PyInstaller and Qt
      # only need somewhere writable.
      HOME: /tmp
      QT_QPA_PLATFORM: offscreen
    stdin_open: true
    tty: true

  # The real window in a browser, for checking the GUI by hand: see
  # docs/development.md. Only published on localhost; the VNC session has no
  # password.
  gui:
    build:
      context: .
      target: gui
    image: comic-cleaner-gui:local
    working_dir: /workspace
    user: "${CC_UID:-1000}:${CC_GID:-1000}"
    init: true
    volumes:
      - .:/workspace
      - ${CC_TEST_COMICS:-/home/prime/Temp/PageMaster-Test-Content}:/comics:ro
    environment:
      CC_GUI_SIZE: ${CC_GUI_SIZE:-1600x1000x24}
      CC_GUI_PORT: ${CC_GUI_PORT:-6080}
    ports:
      - "127.0.0.1:${CC_GUI_PORT:-6080}:6080"
    command: ["sh", "docker/gui.sh"]

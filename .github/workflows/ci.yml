name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The GUI tests drive a real Qt window with no display attached.
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Prove the floor of the supported range still works.
          - os: ubuntu-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # PySide6 links these even under the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install archive tools
        # Exercises the .cbr/.cb7 backends on the platforms that have packages.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends p7zip-full unrar-free || true
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install p7zip || true
          fi
        shell: bash

      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Self-test the source tree
        run: python -m comiccleaner --self-test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ComicCleaner-windows
          - os: macos-latest
            artifact: ComicCleaner-macos
          - os: ubuntu-latest
            artifact: ComicCleaner-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"

      - name: Build and smoke-test
        # --smoke-test launches the real binary and fails on any traceback,
        # which is how a packaging error (a missing codec, an unbundled asset)
        # gets caught instead of shipping.
        run: python build.py --clean --smoke-test

      - name: Build and smoke-test the command-line exe
        if: runner.os == 'Windows'
        # The normal exe is windowed, and a windowed exe has no stdout, so a
        # shell can neither read its output nor wait for its exit code. Windows
        # gets a console build for scan/clean; elsewhere one binary serves both.
        run: python build.py --cli --smoke-test

      - name: Self-test the packaged build
        if: runner.os != 'Windows'
        # Windowed builds have no stdout, so the report goes to a file; on
        # macOS the executable lives inside the .app bundle.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/ComicCleaner.app/Contents/MacOS/ComicCleaner --self-test || true
          else
            ./dist/ComicCleaner --self-test || true
          fi
          cat comiccleaner-selftest.txt 2>/dev/null || true
        shell: bash

      - name: Package for download
        # One file per platform. tar and ditto keep the executable bit and the
        # .app layout, which upload-artifact on its own would strip.
        shell: bash
        run: |
          version=$(grep '^__version__' src/comiccleaner/__init__.py | cut -d'"' -f2)
          mkdir release
          case "$RUNNER_OS" in
            Windows)
              cp dist/ComicCleaner.exe "release/ComicCleaner-$version-windows-x64.exe"
              cp dist/comiccleaner-cli.exe "release/comiccleaner-cli-$version-windows-x64.exe" ;;
            macOS) ditto -c -k --keepParent dist/ComicCleaner.app "release/ComicCleaner-$version-macos-arm64.zip" ;;
            Linux) tar -czf "release/ComicCleaner-$version-linux-x64.tar.gz" -C dist ComicCleaner ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    # Only for version tags; ordinary pushes just build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach the files

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the project version
        run: |
          package=$(grep '^__version__' src/comiccleaner/__init__.py | cut -d'"' -f2)
          metadata=$(grep '^version' pyproject.toml | head -n 1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$package" ] || [ "$package" != "$metadata" ]; then
            echo "Tag $GITHUB_REF_NAME, __init__ $package and pyproject $metadata must all agree."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --title "Comic Cleaner ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag

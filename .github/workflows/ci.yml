name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The GUI tests drive a real Qt window with no display attached.
  QT_QPA_PLATFORM: offscreen
  # The official 7-Zip, which reads .cbr; distribution and Homebrew builds leave
  # out the RAR codec. Digests from the release page, as in the Dockerfile.
  SEVENZIP_VERSION: "26.03"
  SEVENZIP_SHA256_LINUX: dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695
  SEVENZIP_SHA256_MAC: 5ca87677072c59f5602e5c49baa27d4694bacd2259b4e507f0094249d4281480

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned: ubuntu-latest moves to 26.04 from 2026-10-19, and the Qt
        # libraries below are installed by package name. Move it on purpose.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Prove the floor of the supported range still works.
          - os: ubuntu-24.04
            python: "3.10"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # PySide6 links these even under the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install the official 7-Zip
        # Exercises the .cbr/.cb7 backend. Windows runners have none, and read
        # RAR through their own tar.exe (bsdtar).
        if: runner.os != 'Windows'
        run: |
          tag=$(echo "$SEVENZIP_VERSION" | tr -d .)
          if [ "$RUNNER_OS" = "Linux" ]; then
            file="7z$tag-linux-x64.tar.xz"; sum="$SEVENZIP_SHA256_LINUX"
          else
            file="7z$tag-mac.tar.xz"; sum="$SEVENZIP_SHA256_MAC"
          fi
          curl -fsSL -o "$RUNNER_TEMP/7z.tar.xz" \
            "https://github.com/ip7z/7zip/releases/download/$SEVENZIP_VERSION/$file"
          echo "$sum  $RUNNER_TEMP/7z.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/7z.tar.xz" -C "$RUNNER_TEMP" 7zz
          sudo install -m 755 "$RUNNER_TEMP/7zz" /usr/local/bin/7zz
          7zz i | grep -q Rar5
        shell: bash

      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check the release notes
        # On a version tag, fail in a minute rather than after every build:
        # the release takes its notes from this version's CHANGELOG.md section.
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python build.py --release-notes "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Type check
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        # The whole package is held clean: any mypy error fails the job.
        run: python -m mypy

      - name: Test with coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python -m pytest -q --cov=comiccleaner --cov-report=term-missing

      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-24.04' && matrix.python == '3.12') }}
        run: python -m pytest -q

      - name: Self-test the source tree
        run: python -m comiccleaner --self-test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ComicCleaner-windows
          - os: macos-latest
            artifact: ComicCleaner-macos
          # The binary needs the glibc it was built against or newer. 22.04's
          # 2.35 lets it run on Ubuntu 22.04, Debian 12 and later; built on
          # ubuntu-24.04 it refused to start on anything before glibc 2.38.
          - os: ubuntu-22.04
            artifact: ComicCleaner-linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # PyInstaller bundles the libraries it finds here. Qt's xcb plugin needs
        # the xcb-util ones, which many desktops lack (libxcb-cursor0 above all),
        # so they are installed to be carried in the tarball and the AppImage.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1

      - name: Install the project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"

      - name: Build and smoke-test
        # --smoke-test launches the real binary and fails on any traceback,
        # which is how a packaging error (a missing codec, an unbundled asset)
        # gets caught instead of shipping.
        run: python build.py --clean --smoke-test

      - name: Build and smoke-test the command-line exe
        if: runner.os == 'Windows'
        # The normal exe is windowed, and a windowed exe has no stdout, so a
        # shell can neither read its output nor wait for its exit code. Windows
        # gets a console build for scan/clean; elsewhere one binary serves both.
        run: python build.py --cli --smoke-test

      - name: Self-test the packaged build
        if: runner.os != 'Windows'
        # Windowed builds have no stdout, so the report may go to a file instead;
        # on macOS the executable lives inside the .app bundle. A non-zero exit,
        # or a FAIL: line in either report, fails the job.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            exe=./dist/ComicCleaner.app/Contents/MacOS/ComicCleaner
          else
            exe=./dist/ComicCleaner
          fi
          status=0
          "$exe" --self-test > selftest-stdout.txt 2>&1 || status=$?
          cat selftest-stdout.txt
          cat comiccleaner-selftest.txt 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::The packaged self-test exited with status $status"
            exit 1
          fi
          # -s: the file report exists only when there was no stdout.
          if grep -Eqs '^[[:space:]]*FAIL:' selftest-stdout.txt comiccleaner-selftest.txt; then
            echo "::error::The packaged self-test reported a failure"
            exit 1
          fi
        shell: bash

      - name: Build and self-test the AppImage
        if: runner.os == 'Linux'
        # A one-folder build packed with a pinned appimagetool, beside the
        # one-file build above. There is no FUSE on the runner, so it unpacks
        # itself to run; a non-zero exit or a FAIL: line fails the job.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          python build.py --appimage --smoke-test
          status=0
          ./dist/ComicCleaner-x86_64.AppImage --self-test > appimage-selftest.txt 2>&1 || status=$?
          cat appimage-selftest.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::The AppImage self-test exited with status $status"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*FAIL:' appimage-selftest.txt; then
            echo "::error::The AppImage self-test reported a failure"
            exit 1
          fi

      - name: Self-test the packaged command-line exe
        if: runner.os == 'Windows'
        # The windowed exe has no console to report to or exit code to wait on,
        # so the console build, packaged the same way, runs the self-test.
        run: |
          status=0
          ./dist/comiccleaner-cli.exe --self-test > selftest-stdout.txt 2>&1 || status=$?
          cat selftest-stdout.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::The packaged self-test exited with status $status"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*FAIL:' selftest-stdout.txt; then
            echo "::error::The packaged self-test reported a failure"
            exit 1
          fi
        shell: bash

      - name: Package for download
        # One file per platform. tar and ditto keep the executable bit and the
        # .app layout, which upload-artifact on its own would strip.
        shell: bash
        run: |
          version=$(grep '^__version__' src/comiccleaner/__init__.py | cut -d'"' -f2)
          mkdir release
          case "$RUNNER_OS" in
            Windows)
              cp dist/ComicCleaner.exe "release/ComicCleaner-$version-windows-x64.exe"
              cp dist/comiccleaner-cli.exe "release/comiccleaner-cli-$version-windows-x64.exe" ;;
            macOS) ditto -c -k --keepParent dist/ComicCleaner.app "release/ComicCleaner-$version-macos-arm64.zip" ;;
            Linux)
              tar -czf "release/ComicCleaner-$version-linux-x64.tar.gz" -C dist ComicCleaner
              cp dist/ComicCleaner-x86_64.AppImage "release/ComicCleaner-$version-x86_64.AppImage" ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    # Only for version tags; ordinary pushes just build and test.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release and attach the files

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the project version
        run: |
          package=$(grep '^__version__' src/comiccleaner/__init__.py | cut -d'"' -f2)
          metadata=$(grep '^version' pyproject.toml | head -n 1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$package" ] || [ "$package" != "$metadata" ]; then
            echo "Tag $GITHUB_REF_NAME, __init__ $package and pyproject $metadata must all agree."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write the release notes
        # This version's CHANGELOG.md section; build.py refuses a missing one,
        # or one still marked unreleased.
        run: python3 build.py --release-notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The CHANGELOG section first; GitHub's generated notes, the list of
        # changes and the compare link, are appended after it.
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --title "Comic Cleaner ${GITHUB_REF_NAME#v}" \
            --notes "$(cat "$RUNNER_TEMP/notes.md")" --generate-notes --verify-tag

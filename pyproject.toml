[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comiccleaner"
version = "0.1.0"
description = "Find and remove duplicate/injected pages (ads, scanlation credits) across comic archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trevor Edwards" }]
keywords = ["comics", "cbz", "cbr", "duplicate", "deduplication", "perceptual-hash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
build = [
    "pyinstaller>=6.3",
]

[project.urls]
Homepage = "https://github.com/trevoedwards/comic-cleaner"
Issues = "https://github.com/trevoedwards/comic-cleaner/issues"

[project.scripts]
comiccleaner = "comiccleaner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comiccleaner = ["assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
# numpy's own stubs use syntax mypy only accepts from 3.12; the 3.10 floor is
# still guarded by ruff's target-version and the Python 3.10 test job.
python_version = "3.12"
packages = ["comiccleaner"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
